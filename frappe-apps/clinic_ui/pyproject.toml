[project]
name = "clinic_ui"
dynamic = ["version"]
description = "Read-only native session and synthetic directory contracts for the clinic UI"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Clinic OpenDesign" }]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
